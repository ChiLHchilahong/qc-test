version: '3.8'

services:
  qc-suite:
    build: .
    ports:
      - "3001:3001"  # Backend API
      - "5173:5173"  # Frontend Vite
    volumes:
      - ./data:/app/data  # Persist SQLite database
      - ./.env:/app/.env  # Environment variables
    environment:
      - NODE_ENV=development
    command: npm run dev